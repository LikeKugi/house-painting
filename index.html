<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunset Cottage - House Painting</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="gallery">
    <h1 class="gallery__title">Sunset Cottage</h1>
    <p class="gallery__subtitle">An oil study in absolute positioning</p>

    <figure class="painting">
        <div id="house">
            <div id="chimney"></div>
            <div id="roof"></div>
            <div id="window-1"></div>
            <div id="window-2"></div>
            <div id="door"></div>
        </div>
        <figcaption class="painting__caption">
            Chimney, roof, windows and door &mdash; every brick positioned absolutely.
        </figcaption>
    </figure>
</main>
</body>
</html>
